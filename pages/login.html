</head>

<body>

<div class="mainsection">
	<div class="container">
		<div class="row">
			<div class="col-md-6">
				<!-- Login form -->
				<form id="login_form" method="post" name="login_form">
					<h3> Login to your account: </h3> <br>
					<div class="form-group">
						<label for="username">User Name:</label>
						<input type="text" class="form-control" name="username" id="username" style="width: 300px;" >
					</div>
					<div class="form-group">
						<label for="password">Password:</label>
						<input type="password" class="form-control" name="password" id="password" style="width: 300px;">
					</div> <br>
					<button type="button" class="btn btn-info" id="login_submit" onclick="validate()">Login</button>
				</form>
			</div>
	
			<div class="col-md-6">
				<!-- Signup form -->
				<form id="signup_form" method="post" name="signup_form">
					<h3> Don't have an account? Sign up now: </h3><br>
					<div class="form-group">
						<label for="new_username">New User Name:</label>
						<input type="text" class="form-control" name="new_username" id="new_username" style="width: 300px;">
					</div>
					<div class="form-group">
						<label for="new_password">New Password:</label>
						<input type="password" class="form-control" name="new_password" id="new_password" style="width: 300px;">
					</div> 
					<div class="form-group">
						<label for="confirm_password">Confirm Password:</label>
						<input type="password" class="form-control" name="confirm_password" id="confirm_password" style="width: 300px;">
					</div> <br>
					<button type="button" class="btn btn-info" id="signup_submit" onclick="signup()">Sign Up</button>
				</form>
			</div>
		</div>
	</div>
</div>
